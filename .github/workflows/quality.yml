name: quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,security]"
      - run: pytest
      - run: ruff check .
      - run: mypy src
      - run: pip-audit
      - run: m365-assessor sbom --output reports/m365-assessor-sbom.json
