defaults:
  description: This check evaluates normalized Exchange Online configuration collected through read-only Microsoft-supported interfaces.
  category: Exchange Security
  service: Exchange Online
  severity: High
  rationale: Consistent tenant-wide messaging controls reduce phishing, malware, data-exfiltration, and account-abuse risk.
  business_impact: Weak messaging controls can expose users and organizational data to external and internal threats.
  recommendation: Review the cited Exchange or Defender policy and approve a tested tenant-wide configuration.
  references: [https://learn.microsoft.com/powershell/exchange/exchange-online-powershell]
  required_permissions: []
rules:
  - check_id: M365-EXO-001
    title: Enable Safe Links for Office applications
    remediation: Enable Office application scanning in an assigned Safe Links policy.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.1"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.safe_links, quantifier: any, min_count: 1, conditions: [{type: equals, field: enable_safe_links_for_office, expected: true}]}
    evidence_fields: [exo002.safe_links]
  - check_id: M365-EXO-002
    title: Enable the common attachment type filter
    remediation: Enable file-type filtering in each effective malware policy.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.2"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.malware_filter, quantifier: all, min_count: 1, conditions: [{type: equals, field: enable_file_filter, expected: true}]}
    evidence_fields: [exo002.malware_filter]
  - check_id: M365-EXO-003
    title: Notify administrators when internal users send malware
    remediation: Enable internal-sender administrator notifications in effective malware policies.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.3"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: DE.CM}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.malware_filter, quantifier: all, min_count: 1, conditions: [{type: equals, field: enable_internal_sender_admin_notifications, expected: true}]}
    evidence_fields: [exo002.malware_filter]
  - check_id: M365-EXO-004
    title: Enable Safe Attachments policies
    remediation: Enable an assigned Safe Attachments policy with a blocking or dynamic-delivery action.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.4"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.safe_attachments, quantifier: any, min_count: 1, conditions: [{type: equals, field: enable, expected: true}]}
    evidence_fields: [exo002.safe_attachments]
  - check_id: M365-EXO-005
    title: Enable Safe Attachments for SharePoint, OneDrive, and Teams
    remediation: Enable Defender protection for SharePoint, OneDrive, and Teams content.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.5"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: equals, field: exo002.atp_policy.enable_atpfor_spo_teams_odb, expected: true}
    evidence_fields: [exo002.atp_policy]
  - check_id: M365-EXO-006
    title: Notify administrators about outbound spam
    remediation: Configure outbound spam policies to notify monitored administrators.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.6"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: DE.CM}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.outbound_spam, quantifier: all, min_count: 1, conditions: [{type: truthy, field: notify_outbound_spam}]}
    evidence_fields: [exo002.outbound_spam]
  - check_id: M365-EXO-007
    title: Maintain an enabled anti-phishing policy
    remediation: Create, enable, and assign an anti-phishing policy to protected recipients.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.7"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.anti_phish, quantifier: any, min_count: 1, conditions: [{type: equals, field: enabled, expected: true}]}
    evidence_fields: [exo002.anti_phish]
  - check_id: M365-EXO-008
    title: Publish SPF for every accepted Exchange domain
    remediation: Publish an accurate SPF TXT record for each mail-sending accepted domain.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.8"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.spf_records, quantifier: all, min_count: 1, conditions: [{type: equals, field: published, expected: true}]}
    evidence_fields: [exo002.spf_records]
  - check_id: M365-EXO-009
    title: Enable DKIM for every Exchange Online domain
    remediation: Provision and enable DKIM signing for each applicable custom domain.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.9"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.dkim, quantifier: all, min_count: 1, conditions: [{type: equals, field: enabled, expected: true}]}
    evidence_fields: [exo002.dkim]
  - check_id: M365-EXO-010
    title: Publish DMARC for every accepted Exchange domain
    remediation: Publish a valid DMARC TXT record for every mail-sending accepted domain.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.10"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.dmarc_records, quantifier: all, min_count: 1, conditions: [{type: equals, field: published, expected: true}]}
    evidence_fields: [exo002.dmarc_records]
  - check_id: M365-EXO-011
    title: Apply attachment filtering comprehensively
    remediation: Enable the common file filter in every effective malware policy and review file types.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.11"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.malware_filter, quantifier: all, min_count: 1, conditions: [{type: equals, field: enable_file_filter, expected: true}]}
    evidence_fields: [exo002.malware_filter]
  - check_id: M365-EXO-012
    title: Keep connection-filter IP allow lists empty
    remediation: Remove IP allow-list entries and use authenticated connectors where a trusted route is required.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.12"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.connection_filter, quantifier: all, min_count: 1, conditions: [{type: equals, field: ip_allow_list, expected: []}]}
    evidence_fields: [exo002.connection_filter]
  - check_id: M365-EXO-013
    title: Disable the connection-filter safe list
    remediation: Disable EnableSafeList in each hosted connection-filter policy.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.13"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.connection_filter, quantifier: all, min_count: 1, conditions: [{type: equals, field: enable_safe_list, expected: false}]}
    evidence_fields: [exo002.connection_filter]
  - check_id: M365-EXO-014
    title: Avoid allowed domains in inbound anti-spam policies
    remediation: Remove allowed sender domains from inbound anti-spam policies and use narrowly scoped alternatives.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.14"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.inbound_spam, quantifier: all, min_count: 1, conditions: [{type: equals, field: allowed_sender_domains, expected: []}]}
    evidence_fields: [exo002.inbound_spam]
  - check_id: M365-EXO-015
    title: Configure outbound anti-spam recipient limits
    remediation: Set bounded hourly and daily recipient limits and an enforcement action in outbound policies.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "2.1.15"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo002]
    evaluation: {type: collection, field: exo002.outbound_spam, quantifier: all, min_count: 1, conditions: [{type: gte, field: recipient_limit_per_day, expected: 1}]}
    evidence_fields: [exo002.outbound_spam]
  - check_id: M365-EXO-016
    title: Keep organization-wide mailbox auditing enabled
    remediation: Set AuditDisabled to false at the Exchange organization level.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.1.1"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: DE.CM}]
    collector_dependencies: [exo001]
    evaluation: {type: equals, field: exo001.organization_config.audit_disabled, expected: false}
    evidence_fields: [exo001.organization_config.audit_disabled]
  - check_id: M365-EXO-017
    title: Enable auditing on every mailbox
    remediation: Enable mailbox auditing and configure the required owner, delegate, and administrator actions.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.1.2"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: DE.CM}]
    collector_dependencies: [exo003]
    evaluation: {type: collection, field: exo003.mailboxes, quantifier: all, min_count: 1, conditions: [{type: equals, field: audit_enabled, expected: true}]}
    evidence_fields: [exo003.mailboxes]
  - check_id: M365-EXO-018
    title: Disable mailbox audit bypass
    remediation: Disable AuditBypassEnabled for every mailbox audit bypass association.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.1.3"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: DE.CM}]
    collector_dependencies: [exo003]
    evaluation: {type: collection, field: exo003.audit_bypass, quantifier: all, conditions: [{type: equals, field: audit_bypass_enabled, expected: false}]}
    evidence_fields: [exo003.audit_bypass]
  - check_id: M365-EXO-019
    title: Block mailbox and remote-domain forwarding
    remediation: Remove mailbox forwarding and disable automatic forwarding on remote domains.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.2.1"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo001, exo003]
    evaluation:
      type: all
      conditions:
        - {type: collection, field: exo001.remote_domains, quantifier: all, min_count: 1, conditions: [{type: equals, field: auto_forward_enabled, expected: false}]}
        - {type: collection, field: exo003.mailboxes, quantifier: all, min_count: 1, conditions: [{type: falsy, field: forwarding_address}, {type: falsy, field: forwarding_smtp_address}]}
    evidence_fields: [exo001.remote_domains, exo003.mailboxes]
  - check_id: M365-EXO-020
    title: Do not use transport rules to whitelist sender domains
    remediation: Remove rules that combine sender-domain conditions with an SCL bypass action.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.2.2"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo003]
    evaluation: {type: collection, field: exo003.transport_rules, quantifier: none, conditions: [{type: equals, field: set_scl, expected: -1}, {type: truthy, field: sender_domain_is}]}
    evidence_fields: [exo003.transport_rules]
  - check_id: M365-EXO-021
    title: Identify messages from external senders
    remediation: Enable the external sender identification feature in Exchange Online.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.2.3"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo001]
    evaluation: {type: equals, field: exo001.external_sender.enabled, expected: true}
    evidence_fields: [exo001.external_sender]
  - check_id: M365-EXO-022
    title: Restrict users from installing Outlook add-ins
    remediation: Remove broad enabled assignments for the user add-in management roles.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.3.1"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.AA}]
    collector_dependencies: [exo003]
    evaluation: {type: collection, field: exo003.management_assignments, quantifier: none, conditions: [{type: equals_ci, field: role, expected: "My Custom Apps"}, {type: equals, field: enabled, expected: true}]}
    evidence_fields: [exo003.management_assignments]
  - check_id: M365-EXO-023
    title: Disable personal accounts in Outlook web policy
    remediation: Disable personal account and calendar integration in every effective OWA mailbox policy.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.3.2"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo001]
    evaluation: {type: collection, field: exo001.owa_policies, quantifier: all, min_count: 1, conditions: [{type: equals, field: personal_accounts_enabled, expected: false}]}
    evidence_fields: [exo001.owa_policies]
  - check_id: M365-EXO-024
    title: Require modern authentication for Exchange Online
    remediation: Enable OAuth2 client profiles and remove legacy authentication dependencies.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.5.1"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.AA}]
    collector_dependencies: [exo001]
    evaluation: {type: equals, field: exo001.organization_config.oauth2_client_profile_enabled, expected: true}
    evidence_fields: [exo001.organization_config.oauth2_client_profile_enabled]
  - check_id: M365-EXO-025
    title: Enable Exchange MailTips
    remediation: Enable all MailTips, external-recipient tips, and group metrics.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.5.2"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo001]
    evaluation:
      type: all
      conditions:
        - {type: equals, field: exo001.organization_config.mail_tips_all_tips_enabled, expected: true}
        - {type: equals, field: exo001.organization_config.mail_tips_external_recipients_tips_enabled, expected: true}
        - {type: equals, field: exo001.organization_config.mail_tips_group_metrics_enabled, expected: true}
    evidence_fields: [exo001.organization_config]
  - check_id: M365-EXO-026
    title: Restrict additional storage providers in Outlook on the web
    remediation: Disable additional storage providers in all effective OWA mailbox policies.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.5.3"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.DS}]
    collector_dependencies: [exo001]
    evaluation: {type: collection, field: exo001.owa_policies, quantifier: all, min_count: 1, conditions: [{type: equals, field: additional_storage_providers_available, expected: false}]}
    evidence_fields: [exo001.owa_policies]
  - check_id: M365-EXO-027
    title: Disable SMTP AUTH organization-wide
    remediation: Set SmtpClientAuthenticationDisabled to true and document any scoped exceptions.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.5.4"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.AA}]
    collector_dependencies: [exo001]
    evaluation: {type: equals, field: exo001.transport_config.smtp_client_authentication_disabled, expected: true}
    evidence_fields: [exo001.transport_config]
  - check_id: M365-EXO-028
    title: Reject unauthenticated Direct Send submissions
    remediation: Enable the Exchange organization setting that rejects Direct Send.
    benchmarks: [{framework: CIS, benchmark: Microsoft 365 Foundations, version: "7.0.0", control: "6.5.5"}, {framework: NIST, benchmark: Cybersecurity Framework, version: "2.0", control: PR.AA}]
    collector_dependencies: [exo001]
    evaluation: {type: equals, field: exo001.organization_config.reject_direct_send, expected: true}
    evidence_fields: [exo001.organization_config.reject_direct_send]
