[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "m365-assessor"
version = "1.2.0"
description = "Read-only, extensible Microsoft 365 security assessment tool"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "M365 Assessor contributors" }]
dependencies = [
  "azure-identity>=1.17,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "keyring>=25,<26",
  "msal>=1.31,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]
security = [
  "pip-audit>=2.7,<3",
]

[project.scripts]
m365-assessor = "m365_assessor.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/m365_assessor"]

[tool.hatch.build.targets.wheel.force-include]
"config/permissions.yaml" = "m365_assessor/data/permissions.yaml"
"config/frameworks" = "m365_assessor/data/frameworks"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/m365_assessor/cli/app.py" = ["B008"]
"src/m365_assessor/config.py" = ["S105"]
"src/m365_assessor/models/enums.py" = ["S105"]
"tests/*" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["msal.*", "keyring.*", "azure.identity.*", "openpyxl.*"]
ignore_missing_imports = true
